# Zava Bank — Docker Compose Orchestration
# Brings up all 24 app nodes + 4 infrastructure containers
# Usage: docker compose up

services:

  # ============================================================
  # INFRASTRUCTURE (Level 0 — no dependencies)
  # ============================================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zavabank-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Zava123!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - db-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -C -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zavabank-sqlserver-init
    volumes:
      - ./infrastructure/sql:/scripts
    environment:
      SA_PASSWORD: "Zava123!"
      SQL_SERVER: sqlserver
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    networks:
      - db-net
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: zavabank-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: zava_app
      RABBITMQ_DEFAULT_PASS: zava_pass
      RABBITMQ_DEFAULT_VHOST: /zavabank
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    networks:
      - mq-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: zavabank-mailhog
    ports:
      - "8025:8025"
    networks:
      - mq-net
    healthcheck:
      test: wget -q --spider http://localhost:8025/api/v2/messages || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

