      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/html:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/nginx
    networks:
      - frontend-net
      - backend-net
    depends_on:
      zava-loan-portal:
        condition: service_healthy
      zava-account-manager:
        condition: service_healthy
      zava-report-dashboard:
        condition: service_healthy
      zava-pay-gateway:
        condition: service_healthy
      zava-ledger-core:
        condition: service_healthy
      zava-fraud-detector:
        condition: service_healthy
      zava-kyc-service:
        condition: service_healthy
      zava-transfer-service:
        condition: service_healthy
      zava-interest-calculator:
        condition: service_healthy
      zava-origination-api:
        condition: service_healthy
      zava-doc-vault:
        condition: service_healthy
      zava-compliance-reporter:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ============================================================
# NETWORKS
# ============================================================

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  db-net:
    driver: bridge
  mq-net:
    driver: bridge

# ============================================================
# VOLUMES
# ============================================================

volumes:
  sql-data:
    driver: local
  rabbitmq-data:
    driver: local
  nginx-logs:
    driver: local
  shared-filedrop:
    driver: local
