      DB_PORT: "1433"
      DB_NAME: "ZavaBankDB"
      DB_USER: sa
      DB_PASSWORD: "Zava123!"
      LOG_LEVEL: INFO
    networks:
      - backend-net
      - db-net
    depends_on:
