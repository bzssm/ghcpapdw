# RabbitMQ Configuration for Zava Bank
# Loaded on container startup via volume mount to /etc/rabbitmq/rabbitmq.conf

# Enable management plugin on port 15672
management.listener.port = 15672

# Load definitions on startup
management.load_definitions = /etc/rabbitmq/definitions.json

# Default listener port
listeners.tcp.default = 5672

# Guest user can connect from any host (dev only)
loopback_users = none
