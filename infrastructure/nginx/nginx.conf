# Zava Bank — Nginx Reverse Proxy
# Routes all traffic from port 80 to internal services via Docker DNS.
# .NET frontends (XSP4/Mono): internal port 8080
# Java frontends (Tomcat):     internal port 8080

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ----------------------------------------------------------------
    # Upstreams — .NET Frontend Apps (Mono/XSP4, port 8080)
    # ----------------------------------------------------------------
    upstream auth_gateway {
        server zava-auth-gateway:8080;
    }
    upstream loan_portal {
        server zava-loan-portal:8080;
    }
    upstream account_manager {
        server zava-account-manager:8080;
    }
    upstream report_dashboard {
        server zava-report-dashboard:8080;
    }

    # ----------------------------------------------------------------
    # Upstreams — .NET WCF Services (Mono/XSP4, port 8080)
    # ----------------------------------------------------------------
    upstream risk_engine {
        server zava-risk-engine:8080;
    }
    upstream statement_service {
        server zava-statement-service:8080;
    }
    upstream alert_service {
        server zava-alert-service:8080;
    }
    upstream currency_service {
        server zava-currency-service:8080;
    }

    # ----------------------------------------------------------------
    # Upstreams — Java Frontend Apps (Tomcat, port 8080)
    # ----------------------------------------------------------------
    upstream pay_gateway {
        server zava-pay-gateway:8080;
    }
    upstream fraud_detector {
        server zava-fraud-detector:8080;
    }
    upstream compliance_reporter {
        server zava-compliance-reporter:8080;
    }
    upstream ledger_core {
        server zava-ledger-core:8080;
    }
    upstream kyc_service {
        server zava-kyc-service:8080;
    }
    upstream interest_calculator {
        server zava-interest-calculator:8080;
    }
    upstream origination_api {
        server zava-origination-api:8080;
    }
    upstream doc_vault {
        server zava-doc-vault:8080;
    }
    upstream transfer_service {
        server zava-transfer-service:8080;
    }

    # Docker embedded DNS — re-resolve on upstream IP changes
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # ----------------------------------------------------------------
    # Main Server — zava-bank.local on port 80
    # ----------------------------------------------------------------
    server {
        listen 80;
        server_name zava-bank.local localhost;

        # Health check endpoint for Docker healthcheck
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ==============================================================
        # .NET Frontend Routes
        # ==============================================================

        # Auth Gateway — login/logout
        location /auth/ {
            proxy_pass http://auth_gateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Rewrite upstream redirects so /Login.aspx becomes /auth/Login.aspx
            proxy_redirect / /auth/;
            proxy_redirect http://$host/ /auth/;
        }

        # Loan Portal — loan applications
        location /loans/ {
            proxy_pass http://loan_portal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /loans/;
            proxy_redirect http://$host/ /loans/;
        }

        # Account Manager — customer accounts
        location /accounts/ {
            proxy_pass http://account_manager/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /accounts/;
            proxy_redirect http://$host/ /accounts/;
        }

        # Report Dashboard — reports and analytics
        location /reports/ {
            proxy_pass http://report_dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /reports/;
            proxy_redirect http://$host/ /reports/;
        }

        # ==============================================================
        # .NET WCF Service Routes
        # ==============================================================

        location /services/risk/ {
            proxy_pass http://risk_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /services/statements/ {
            proxy_pass http://statement_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /services/alerts/ {
            proxy_pass http://alert_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /services/currency/ {
            proxy_pass http://currency_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==============================================================
        # Java Frontend Routes
        # ==============================================================

        location /payments/ {
            proxy_pass http://pay_gateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /payments/;
            proxy_redirect http://$host/ /payments/;
        }

        location /fraud/ {
            proxy_pass http://fraud_detector/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /fraud/;
            proxy_redirect http://$host/ /fraud/;
        }

        location /compliance/ {
            proxy_pass http://compliance_reporter/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /compliance/;
            proxy_redirect http://$host/ /compliance/;
        }

        location /ledger/ {
            proxy_pass http://ledger_core/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /kyc/ {
            proxy_pass http://kyc_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /interest/ {
            proxy_pass http://interest_calculator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /origination/ {
            proxy_pass http://origination_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /documents/ {
            proxy_pass http://doc_vault/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /transfers/ {
            proxy_pass http://transfer_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==============================================================
        # Default — Static landing page
        # ==============================================================
        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
